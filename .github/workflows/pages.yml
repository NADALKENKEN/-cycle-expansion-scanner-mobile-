name: Mobile scanner - analyze and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'tests/**'
      - 'site/**'
      - 'export_site.py'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
      - 'universe.csv'
  schedule:
    # JST weekday mornings 07:35 (previous UTC calendar day) and evenings 21:35.
    # GitHub may delay or skip scheduled jobs during congestion.
    - cron: '35 22 * * 0-4'
    - cron: '35 12 * * 1-5'
    # Intraday reference scans during Japan/US sessions and selected FX hours.
    # Cron is best-effort; Pages is not a real-time trading feed.
    - cron: '15 0-6,8,10,12-21 * * 1-5'

concurrency:
  group: mobile-scanner-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install scan dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify calculation code
        run: python -m pytest -q
      - name: Fetch reference prices and calculate day/short/medium signals
        run: |
          if [ -f universe.csv ]; then
            python export_site.py --universe universe.csv
          else
            python export_site.py
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
